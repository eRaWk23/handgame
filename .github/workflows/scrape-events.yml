name: Collect handgame events

# Runs on the 1st and 15th of each month at 7am Pacific, and any time you
# click "Run workflow". Nothing it finds goes live on its own — the run opens
# a pull request and leaves a review queue for you to approve.
on:
  schedule:
    - cron: "0 14 1,15 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Limit to one source (calendars, webpages, reddit, websearch, inbox)"
        required: false
        default: ""
      dry_run:
        description: "Collect but change nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: handgame-scrape
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Tesseract (reads the flyers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Install Python dependencies
        working-directory: scraper
        run: pip install --quiet -r requirements.txt

      - name: Run the test suite
        working-directory: scraper
        run: |
          python3 tests/test_core.py
          python3 tests/test_adapters.py
          python3 tests/test_regressions.py

      - name: Collect events
        working-directory: scraper
        env:
          # Lets the run compare finds against what is already live. The
          # project URL is already public in supabaseClient.js and in
          # keep-alive.yml, so it falls back to that and only the key needs to
          # be a secret — and SUPABASE_ANON_KEY is already set in this repo.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://atorftwulkabkmhaeeir.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: much better at reading stylized flyers.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: finds sites that are not in config.yaml yet.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # Optional: Reddit's official API.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 run.py scrape $ARGS | tee run-log.txt

      - name: Count what is waiting
        id: count
        working-directory: scraper
        run: |
          if [ -f out/pending.json ]; then
            COUNT=$(python3 -c "import json;print(len(json.load(open('out/pending.json'))['events']))")
          else
            COUNT=0
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT event(s) waiting for review."

      # Always keep the queue downloadable, even when there is nothing new,
      # so a run is never a dead end.
      - name: Upload the review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: |
            scraper/out/review.html
            scraper/out/pending.json
            scraper/run-log.txt
          retention-days: 60
          if-no-files-found: warn

      - name: Open a pull request
        if: steps.count.outputs.count != '0' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: scraper/pending-events
          base: main
          add-paths: |
            scraper/state/seen.json
            scraper/out/pending.json
            scraper/out/review.html
          commit-message: "Add ${{ steps.count.outputs.count }} event(s) found by the collector"
          title: "${{ steps.count.outputs.count }} handgame event(s) found — needs review"
          delete-branch: true
          body: |
            The collector found **${{ steps.count.outputs.count }}** event(s) that
            are not already on the site and were not reviewed in an earlier run.

            **Nothing here is live yet.** To review:

            1. Open the **review-queue** artifact on
               [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
               and unzip it.
            2. Open `review.html` in a browser. Check each flyer against the
               fields beside it, fix anything wrong, and hit Approve or Reject.
            3. Click **Publish approved to site**, paste the Supabase project
               URL and anon key, and the approved events are inserted into the
               `events` table.
            4. Merge this pull request. It updates the ledger so the same
               events are never queued again, including the ones you rejected.

            <details><summary>Run log</summary>

            ```
            ${{ github.workflow }} — run ${{ github.run_number }}
            ```

            </details>
