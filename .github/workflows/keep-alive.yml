name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s "https://atorftwulkabkmhaeeir.supabase.co/rest/v1/events?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "%{http_code}")
          echo "HTTP $code"
          # curl exits 0 on a 4xx or 5xx, so check the answer as well as the
          # connection. A red run here means the calendar is failing too.
          [ "$code" = "200" ]
