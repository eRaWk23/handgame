<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Handgame Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-wrap { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .admin-event { background: #1e1e1e; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .admin-event h3 { margin: 0 0 0.5rem; color: #ffdb6e; }
    .admin-event p { margin: 0.2rem 0; font-size: 0.9rem; }
    .admin-actions { display: flex; gap: 0.5rem; flex-shrink: 0; flex-wrap: wrap; }
    .approve-btn { background: #4caf50; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .delete-btn { background: #f44336; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .clear-btn { background: #2196F3; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .approve-btn:hover { background: #43a047; }
    .delete-btn:hover { background: #e53935; }
    .clear-btn:hover { background: #1976D2; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; margin-left: 0.5rem; }
    .badge-pending { background: #f5a623; color: #000; }
    .badge-approved { background: #4caf50; color: #fff; }
    .badge-reported { background: #f44336; color: #fff; }
    #login-wrap { max-width: 400px; margin: 5rem auto; text-align: center; }
    #login-wrap input { width: 100%; padding: 0.75rem; font-size: 1rem; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 1rem; box-sizing: border-box; }
    #login-wrap button { width: 100%; padding: 0.75rem; background: #ffdb6e; color: #111; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    #login-error { color: #f44336; margin-top: 0.5rem; min-height: 1.5rem; }
    .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #555; background: transparent; color: #ccc; cursor: pointer; }
    .filter-btn.active { background: #ffdb6e; color: #111; border-color: #ffdb6e; font-weight: bold; }
    .report-count { font-size: 0.8rem; color: #f44336; margin-top: 0.25rem; }
    .edit-btn { background: #ffdb6e; color: #111; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .edit-btn:hover { background: #ffcf3f; }
    .edit-form { width: 100%; }
    .edit-form label { display: block; font-size: 0.8rem; color: #aaa; margin: 0.6rem 0 0.2rem; }
    .edit-form input, .edit-form textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 0.9rem; font-family: inherit; }
    .edit-form textarea { min-height: 5rem; resize: vertical; }
    .edit-form .row { display: flex; gap: 0.75rem; }
    .edit-form .row > div { flex: 1; }
    .edit-actions { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
    .save-btn { background: #4caf50; color: #fff; border: none; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .save-btn:hover { background: #43a047; }
    .cancel-btn { background: #555; color: #fff; border: none; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

<!-- Login screen -->
<div id="login-wrap">
  <h2>Admin Login</h2>
  <input type="email" id="admin-email" placeholder="Email" />
  <input type="password" id="admin-password" placeholder="Password" />
  <button id="login-btn" onclick="login()">Login</button>
  <p id="login-error"></p>
</div>

<!-- Admin panel (hidden until login) -->
<div id="admin-panel" style="display:none;">
  <div class="admin-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem;">
      <h2 style="margin:0;">Handgame Admin</h2>
      <button onclick="logout()" style="background:#444; color:#fff; border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer;">Logout</button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn" onclick="setFilter('reported', this)">🚩 Reported</button>
      <button class="filter-btn" id="pending-filter" onclick="setFilter('pending', this)">Pending</button>
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    </div>

    <div id="admin-event-list"><p>Loading...</p></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://atorftwulkabkmhaeeir.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_0CKKNOHPd3Yd6bDfkEuHlA_YgS9bJvF';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Events come from a public, auto-approving form and are rendered with
  // innerHTML. This admin page shows every submission, including unmoderated
  // ones, so an unescaped payload runs in the one browser that can delete and
  // edit — the worst place for it. Escape every event field before display.
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }
  function safeUrl(value) {
    const s = String(value ?? '').trim();
    return /^https?:\/\//i.test(s) ? s : '';
  }

  let currentFilter = 'all';
  let allEvents = [];

  const { data: { session } } = await supabase.auth.getSession();
  if (session) showPanel();

  window.login = async () => {
    const email    = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');

    btn.textContent = 'Logging in…';
    btn.disabled = true;
    errEl.textContent = '';

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = '❌ ' + error.message;
      btn.textContent = 'Login';
      btn.disabled = false;
    } else {
      showPanel();
    }
  };

  window.logout = async () => {
    await supabase.auth.signOut();
    document.getElementById('login-wrap').style.display = 'block';
    document.getElementById('admin-panel').style.display = 'none';
    document.getElementById('admin-email').value = '';
    document.getElementById('admin-password').value = '';
  };

  document.getElementById('admin-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.login();
  });

  function showPanel() {
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadEvents();
  }

  async function loadEvents() {
    const { data, error } = await supabase
      .from('events')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('admin-event-list').innerHTML = `<p style="color:#f44336">Error: ${esc(error.message)}</p>`;
      return;
    }
    allEvents = data;
    // Submissions stay off the calendar until approved, so open on them.
    if (allEvents.some(e => !e.approved)) {
      window.setFilter('pending', document.getElementById('pending-filter'));
    } else {
      renderEvents();
    }
  }

  function renderEvents() {
    const list = document.getElementById('admin-event-list');
    const pending = allEvents.filter(e => !e.approved).length;
    document.getElementById('pending-filter').textContent = pending ? `Pending (${pending})` : 'Pending';
    let filtered = allEvents;
    if (currentFilter === 'pending')  filtered = allEvents.filter(e => !e.approved);
    if (currentFilter === 'reported') filtered = allEvents.filter(e => (e.report_count || 0) > 0);
    if (currentFilter === 'approved') filtered = allEvents.filter(e => e.approved);

    if (filtered.length === 0) {
      list.innerHTML = `<p style="color:#aaa">No ${currentFilter} events.</p>`;
      return;
    }

    list.innerHTML = filtered.map(event => {
      const reports = event.report_count || 0;
      const badges = [];
      if (!event.approved) badges.push('<span class="badge badge-pending">Pending</span>');
      if (event.approved) badges.push('<span class="badge badge-approved">Approved</span>');
      if (reports > 0) badges.push(`<span class="badge badge-reported">🚩 ${reports} report${reports !== 1 ? 's' : ''}</span>`);

      const flyer = safeUrl(event.flyer_url);
      const id = esc(event.id);
      return `
        <div class="admin-event" data-event-id="${id}" style="${reports >= 3 ? 'border-left: 3px solid #f44336;' : ''}">
          <div>
            <h3>${esc(event.title)} ${badges.join('')}</h3>
            <p><strong>Date:</strong> ${esc(event.start_date)}${event.end_date ? ' – ' + esc(event.end_date) : ''}</p>
            <p><strong>Location:</strong> ${esc(event.location)}</p>
            ${event.tribe ? `<p><strong>Tribe:</strong> ${esc(event.tribe)}</p>` : ''}
            ${event.details ? `<p><strong>Details:</strong> ${esc(event.details)}</p>` : ''}
            ${flyer ? `<a href="${esc(flyer)}" target="_blank"><img src="${esc(flyer)}" style="max-width:150px; border-radius:6px; margin-top:0.5rem;" /></a>` : '<p><em>No flyer</em></p>'}
            <p style="font-size:0.75rem; color:#666;">Submitted: ${new Date(event.created_at).toLocaleString()}</p>
          </div>
          <div class="admin-actions">
            <button class="edit-btn" onclick="editEvent('${id}')">✏️ Edit</button>
            ${!event.approved ? `<button class="approve-btn" onclick="approveEvent('${id}')">✅ Approve</button>` : ''}
            ${reports > 0 ? `<button class="clear-btn" onclick="clearReports('${id}')">🔄 Clear Reports</button>` : ''}
            <button class="delete-btn" onclick="deleteEvent('${id}')">🗑 Delete</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Inline edit. The values are set through the inputs' .value property, never
  // interpolated into HTML, so nothing an event contains can break out of the
  // form. The fields on screen are static markup.
  window.editEvent = (id) => {
    const ev = allEvents.find(e => e.id === id);
    const card = document.querySelector(`.admin-event[data-event-id="${id}"]`);
    if (!ev || !card) return;

    card.innerHTML = `
      <form class="edit-form" autocomplete="off">
        <label>Title</label>
        <input data-field="title" type="text" />
        <div class="row">
          <div><label>Start date</label><input data-field="start_date" type="date" /></div>
          <div><label>End date</label><input data-field="end_date" type="date" /></div>
        </div>
        <label>Location</label>
        <input data-field="location" type="text" />
        <label>Tribe / group</label>
        <input data-field="tribe" type="text" />
        <label>Details</label>
        <textarea data-field="details"></textarea>
        <label>Flyer URL (https://…)</label>
        <input data-field="flyer_url" type="text" />
        <div class="edit-actions">
          <button type="submit" class="save-btn">💾 Save</button>
          <button type="button" class="cancel-btn">Cancel</button>
        </div>
      </form>`;

    const set = (f, v) => { card.querySelector(`[data-field="${f}"]`).value = v ?? ''; };
    set('title', ev.title);
    set('start_date', ev.start_date);
    set('end_date', ev.end_date);
    set('location', ev.location);
    set('tribe', ev.tribe);
    set('details', ev.details);
    set('flyer_url', ev.flyer_url);

    card.querySelector('.cancel-btn').addEventListener('click', renderEvents);
    card.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      saveEvent(id, card);
    });
    card.querySelector('[data-field="title"]').focus();
  };

  async function saveEvent(id, card) {
    const val = f => card.querySelector(`[data-field="${f}"]`).value.trim();
    const flyer = val('flyer_url');
    if (flyer && !/^https?:\/\//i.test(flyer)) {
      alert('Flyer URL must start with http:// or https://, or be left empty.');
      return;
    }
    const payload = {
      title:      val('title'),
      start_date: val('start_date'),
      end_date:   val('end_date') || null,
      location:   val('location'),
      tribe:      val('tribe') || null,
      details:    val('details') || null,
      flyer_url:  flyer || null,
    };
    if (!payload.title || !payload.start_date || !payload.location) {
      alert('Title, start date and location are required.');
      return;
    }
    if (payload.end_date && payload.end_date < payload.start_date) {
      alert('End date cannot be before the start date.');
      return;
    }
    const btn = card.querySelector('.save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    if (!(await writeRow(supabase.from('events').update(payload).eq('id', id)))) {
      btn.disabled = false; btn.textContent = '💾 Save';
      return;
    }
    allEvents = allEvents.map(e => e.id === id ? { ...e, ...payload } : e);
    renderEvents();
  }

  // Every admin write goes through here. .select() makes PostgREST return the
  // rows it actually changed: a row-level-security block comes back as success
  // with an empty array, not an error, so without this check the screen would
  // show a change the database refused. Treat zero rows as a failure.
  async function writeRow(query) {
    const { data, error } = await query.select();
    if (error) { alert('Error: ' + error.message); return false; }
    if (!data || data.length === 0) {
      alert('Nothing was saved. The database refused the change — you may need to log out and back in.');
      return false;
    }
    return true;
  }

  window.approveEvent = async (id) => {
    if (!(await writeRow(supabase.from('events').update({ approved: true }).eq('id', id)))) return;
    allEvents = allEvents.map(e => e.id === id ? { ...e, approved: true } : e);
    renderEvents();
  };

  window.clearReports = async (id) => {
    if (!(await writeRow(supabase.from('events').update({ report_count: 0 }).eq('id', id)))) return;
    allEvents = allEvents.map(e => e.id === id ? { ...e, report_count: 0 } : e);
    renderEvents();
  };

  window.deleteEvent = async (id) => {
    if (!confirm('Delete this event? This cannot be undone.')) return;
    if (!(await writeRow(supabase.from('events').delete().eq('id', id)))) return;
    allEvents = allEvents.filter(e => e.id !== id);
    renderEvents();
  };

  window.setFilter = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderEvents();
  };
</script>

</body>
</html>
