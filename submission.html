<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit a Handgame Event</title>
  <meta name="description" content="Submit an upcoming Handgame event to share with the community." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="submission.css" />
</head>
<body>

<div class="container submission-wrap">

  <button class="back-button" onclick="window.location.href='index.html'">← Back to Events</button>

  <form id="event-form" novalidate>
    <h2>Submit a Handgame Event</h2>
    <p class="form-intro">All submissions are reviewed before going live. Fields marked <span class="required-star">*</span> are required.</p>

    <label for="title">Event Title <span class="required-star">*</span></label>
    <input id="title" type="text" name="title" placeholder="e.g. Annual Handgame" required />

    <label for="start_date">Start Date <span class="required-star">*</span></label>
    <input id="start_date" type="date" name="start_date" required />

    <label for="end_date">End Date <span class="sub-label">(if multi-day)</span></label>
    <input id="end_date" type="date" name="end_date" />

    <label for="location">Location <span class="required-star">*</span></label>
    <input id="location" type="text" name="location" placeholder="City, State or Tribe/Reservation" required />

    <label for="tribe">Tribe / Group <span class="sub-label">(optional)</span></label>
    <input id="tribe" type="text" name="tribe" placeholder="e.g. Paiute" />

    <label for="details">Event Details <span class="sub-label">(optional)</span></label>
    <textarea id="details" name="details" rows="4" placeholder="Prize info, contact, schedule, etc."></textarea>

    <label for="flyer">Upload Flyer <span class="sub-label">(image file — jpg, png, webp, gif)</span></label>
    <input id="flyer" type="file" name="flyer" accept="image/*" />

    <p class="divider-label">— or —</p>

    <label for="flyer_url">Link to Flyer <span class="sub-label">(paste a URL)</span></label>
    <input id="flyer_url" type="url" name="flyer_url" placeholder="https://…" />

    <div id="flyer-preview"></div>

    <button type="submit" id="submit-btn">Submit Event</button>
    <p id="form-status" role="status" aria-live="polite"></p>
  </form>

</div>

<footer>
  <div class="container">
    <div class="toggle-container">
      <button class="toggle-button" onclick="toggleTheme()">☀️ / 🌙 Light/Dark Mode</button>
    </div>
    <p>&copy; 2026 HandGame Community</p>
  </div>
</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://atorftwulkabkmhaeeir.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0b3JmdHd1bGthYmttaGFlZWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDk5MTQsImV4cCI6MjA5NDYyNTkxNH0.SW0OdvAZvAh81PqpLkez1MO8WnMruQxMoCitpcd-PMs';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form         = document.getElementById('event-form');
  const status       = document.getElementById('form-status');
  const flyerInput   = document.getElementById('flyer');
  const flyerUrl     = document.getElementById('flyer_url');
  const flyerPreview = document.getElementById('flyer-preview');
  const submitBtn    = document.getElementById('submit-btn');

  flyerInput.addEventListener('change', () => {
    flyerUrl.value = '';
    flyerPreview.innerHTML = '';
    const file = flyerInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = e => renderPreview(e.target.result, 'Flyer Preview');
      reader.readAsDataURL(file);
    }
  });

  flyerUrl.addEventListener('input', () => {
    flyerInput.value = '';
    flyerPreview.innerHTML = '';
    const url = flyerUrl.value.trim();
    if (url) renderPreview(url, 'Flyer URL Preview');
  });

  function renderPreview(src, alt) {
    flyerPreview.innerHTML = `
      <figure class="flyer-preview-figure">
        <img src="${src}" alt="${alt}"
          onerror="this.parentElement.innerHTML='<p class=preview-error>Could not load image. Double-check the URL.</p>'" />
        <figcaption>${alt}</figcaption>
      </figure>`;
  }

  function looksLikeImageUrl(url) {
    try {
      const u = new URL(url);
      return u.protocol === 'https:' && u.pathname.length > 1;
    } catch { return false; }
  }

  function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-');
  return new Date(Number(y), Number(m)-1, Number(d))
    .toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    status.textContent = '';
    status.className   = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    const title      = form.title.value.trim();
    const start_date = form.start_date.value;
    const end_date   = form.end_date.value || null;
    const location   = form.location.value.trim();
    const tribe      = form.tribe.value.trim() || null;
    const details    = form.details.value.trim() || null;
    const flyerFile  = flyerInput.files[0];
    let   flyer_url  = flyerUrl.value.trim() || null;

    if (!title || !start_date || !location) {
      showStatus('❌ Please fill in all required fields.', 'error'); return;
    }
    if (end_date && end_date < start_date) {
      showStatus('❌ End date cannot be before start date.', 'error'); return;
    }
    if (flyer_url && !looksLikeImageUrl(flyer_url)) {
      showStatus('❌ Flyer URL must start with https://.', 'error'); return;
    }

    if (flyerFile) {
      const ext = flyerFile.name.split('.').pop();
      const fileName = `${Date.now()}.${ext}`;
      const { error: uploadError } = await supabase.storage
        .from('event-flyers')
        .upload(fileName, flyerFile, { cacheControl: '3600', upsert: false });
      if (uploadError) { showStatus(`❌ Flyer upload failed: ${uploadError.message}`, 'error'); return; }
      const { data: urlData } = supabase.storage.from('event-flyers').getPublicUrl(fileName);
      flyer_url = urlData?.publicUrl ?? null;
    }

    // Check for duplicates by date + location, or date + title
    const { data: byLocation } = await supabase
      .from('events')
      .select('id, title, start_date, location')
      .eq('start_date', start_date)
      .ilike('location', location);
    const { data: byTitle } = await supabase
      .from('events')
      .select('id, title, start_date, location')
      .eq('start_date', start_date)
      .ilike('title', title);
    const existing = [...(byLocation || []), ...(byTitle || [])];
    const uniqueExisting = existing.filter((e, i, arr) => arr.findIndex(x => x.id === e.id) === i);
    if (uniqueExisting.length > 0 && !form.dataset.confirmedDuplicate) {
      showStatus(`⚠️ "${uniqueExisting[0].title}" on ${formatDate(start_date)} already exists. Submit again to post anyway.`, 'warning');
      form.dataset.confirmedDuplicate = 'true';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Anyway';
      return;
    }
    form.dataset.confirmedDuplicate = '';

    const { error: insertError } = await supabase.from('events').insert([{
      title, start_date, end_date, location, tribe, details, flyer_url
    }]);

    if (insertError) {
      showStatus(`❌ Submission failed: ${insertError.message}`, 'error');
    } else {
      showStatus('✅ Event submitted! Redirecting…', 'success');
      form.reset();
      flyerPreview.innerHTML = '';
      setTimeout(() => window.location.href = 'index.html', 2500);
    }
  });

  function showStatus(msg, type) {
    status.textContent    = msg;
    status.className      = type;
    submitBtn.disabled    = false;
    submitBtn.textContent = 'Submit Event';
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
  });
</script>

<script>
  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  }
</script>

</body>
</html>
