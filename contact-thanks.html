<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks - Handgame.info</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="container" style="padding-top:4rem;">
  <h1 style="font-size:2rem;">Message Sent</h1>
  <p style="font-size:1.2rem; margin:2rem 0;">Thank you for reaching out. We'll get back to you as soon as we can.</p>
  <a href="index.html" class="submit-button" style="display:inline-block; margin-top:1rem;">← Back to Events</a>
</main>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const storedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (storedTheme === 'light' || (!storedTheme && !prefersDark)) {
      document.body.classList.add('light-mode');
    }
  });
</script>

</body>
</html>
